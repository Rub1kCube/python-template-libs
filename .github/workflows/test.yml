name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-template:
    name: Template / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Check dependencies
        run: |
          uv lock --check
          uv pip check
      - name: Check code and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Check types
        run: |
          uv run --no-sync mypy .
          uv run --no-sync pyright
      - name: Test generation and license packaging
        run: uv run --no-sync pytest

  test-generated-project:
    name: ${{ matrix.library-type }} library / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        library-type: [standard, django]
    env:
      LIBRARY_TYPE: ${{ matrix.library-type }}
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install template dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Generate a library
        run: |
          uv run --no-sync cookiecutter . --no-input --output-dir "$RUNNER_TEMP/generated" \
            project_name=sample-library type_lib="$LIBRARY_TYPE" \
            min_version_python="$PYTHON_VERSION" copyright_holder='Example Organization'
      - name: Install library dependencies
        working-directory: ${{ runner.temp }}/generated/sample-library
        run: uv sync --all-groups --all-extras
      - name: Check the library
        working-directory: ${{ runner.temp }}/generated/sample-library
        run: |
          uv lock --check
          uv pip check
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy .
          uv run --no-sync pyright
          uv run --no-sync pytest
      - name: Build the library
        working-directory: ${{ runner.temp }}/generated/sample-library
        run: uv build
